# This is a basic workflow to help you get started with Actions

name: build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events
    - cron: "0 0 1 * *"

  
env:
  GCI:  git-commit-info.txt

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # https://github.com/marktext/marktext/actions/runs/1539033367/workflow
  build-windows:
    runs-on: windows-latest
    continue-on-error: false
    timeout-minutes: 60

    env:
      # MARKTEXT_IS_STABLE: 1
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
         repository: 'marktext/marktext' 
      
      - name: Get latest commit
        shell: pwsh
        run: |
          git log --pretty=format:"%cd|||%cn|||%s" -1 --date=unix > ${{env.GCI}}

      - name: 上传git提交信息
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.GCI}}
          path: ${{env.GCI}}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          check-latest: true
          cache: yarn
          cache-dependency-path: yarn.lock

      # Workaround: Fix native build failure due to outdated node-gyp version.
      - name: Fix node-gyp
        run: |
          npm install --global node-gyp@latest
          npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}
          node-gyp install
        shell: pwsh

      # 关键步骤1：安装Node.js（指定项目所需版本，比如16/18）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'  # 替换为MarkText项目要求的Node版本
          cache: 'yarn'       # 缓存yarn依赖，加速构建

      - name: Install Visual Studio 2022 Build Tools (C++ Components)
        run: |
          # 使用choco安装VS Build Tools，指定安装C++核心组件
          choco install visualstudio2022buildtools -y --no-progress `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --norestart"
        shell: pwsh
        env:
          CHOCO_NO_PROGRESS: 'true'  # 禁用choco的进度条，加速输出

      # 关键步骤2：安装Windows C++构建工具链（解决node-gyp依赖）
      - name: Configure MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: 'x64'  # 指定64位架构

      # 可选：如果上述步骤不够，可通过choco安装python（node-gyp也依赖python）
      - name: Install Python (if needed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # node-gyp推荐的Python版本
          
      - name: Install dependencies
        run: yarn install --check-files --frozen-lockfile
        
      - name: Build
        run: yarn run release:win
        
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exe-file
          path: |
            build/**/marktext-setup.exe
            
  parse-artifacts:
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
           ls -lshR
           log=$(cat */${{env.GCI}})
           timestamp=$(echo $log | grep -o '^[0-9]\+')
           # 转换到中国时间
           china=$(($timestamp + 28800))
           dateTime=$(date --date="@$china" +"%Y-%m-%d %H:%M:%S")
           dateTimeFileName=$(date --date="@$china" +"%Y-%m-%d_%H.%M.%S")
           echo "GIT_COMMIT_DATE_TIME_FILE_NAME=$dateTimeFileName" >> $GITHUB_ENV
           now=$(date +%s)
           now=$(($now + 28800))
           echo "TIME_STAMP=$(date --date="@$now" +%Y-%m-%d_%H.%M.%S)" >> $GITHUB_ENV
           echo "GIT_COMMIT_INFO=$log" >> $GITHUB_ENV
           echo -e "$dateTime \n $log" > CHANGELOG.txt
           #sudo apt update
           #sudo apt install -y upx
           #find -name *.exe -exec upx -9 "{}" \;
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.GIT_COMMIT_DATE_TIME_FILE_NAME}}_${{env.TIME_STAMP}}
          body_path: CHANGELOG.txt
          files: |
            **/*.exe

  keep-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # GitHub官方的检出代码动作
        
      - name: 🚗 Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push
